<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-label="Diagram: angles adjacent on one side of a straight line, with an unknown angle x.">
<title>Angles on a straight line</title>
<desc>Angles of 10 degrees, 89 degrees and an unknown angle x are adjacent, in order, along one side of a straight line.</desc>
<style>.gl{stroke:#111;stroke-width:3;fill:none}.ga{stroke:#111;stroke-width:2;fill:none}.gt{stroke:#111;stroke-width:3}.gx{stroke:#555;stroke-width:1.5;stroke-dasharray:5 4;stroke-linecap:round;fill:none}.gv{fill:#111}text{font-family:sans-serif;font-size:30px;fill:#111}.gn{font-size:22px;fill:#444;letter-spacing:1px}</style>
<line class="gl" x1="880" y1="538" x2="120" y2="538"/>
<line class="gl" x1="500" y1="538" x2="874" y2="472"/>
<line class="gl" x1="500" y1="538" x2="441" y2="162"/>
<path class="ga" d="M 544 538 A 44 44 0 0 0 543 530"/>
<path class="ga" d="M 563 527 A 64 64 0 0 0 490 475"/>
<path class="ga" d="M 487 455 A 84 84 0 0 0 416 538"/>
<line class="gx" x1="594" y1="530" x2="858" y2="506"/>
<text x="899" y="503" text-anchor="middle">10°</text>
<text x="559" y="457" text-anchor="middle">89°</text>
<text x="409" y="459" text-anchor="middle">x</text>
<text class="gn" x="500" y="685" text-anchor="middle">NOT TO SCALE</text>
</svg>