<line class="gl" x1="500" y1="540" x2="520" y2="160"/>
<line class="gl" x1="500" y1="540" x2="421" y2="168"/>
<path class="ga" d="M 544 540 A 44 44 0 0 0 542 529"/>
<path class="ga" d="M 562 523 A 64 64 0 0 0 503 476"/>
<path class="ga" d="M 504 456 A 84 84 0 0 0 483 458"/>
<path class="ga" d="M 478 438 A 104 104 0 0 0 396 540"/>
<text x="761" y="508" text-anchor="middle">15°</text>
<text x="563" y="462" text-anchor="middle">72°</text>
