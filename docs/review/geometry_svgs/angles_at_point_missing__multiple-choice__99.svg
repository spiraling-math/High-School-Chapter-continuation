<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-label="Diagram: angles meeting consecutively around a point, with an unknown angle x.">
<title>Angles around a point</title>
<desc>Angles of 10 degrees, 70 degrees and an unknown angle x are arranged consecutively, with no gaps, around a single point.</desc>
<style>.gl{stroke:#111;stroke-width:3;fill:none}.ga{stroke:#111;stroke-width:2;fill:none}.gt{stroke:#111;stroke-width:3}.gx{stroke:#111;stroke-width:3}.gv{fill:#111}text{font-family:sans-serif;font-size:30px;fill:#111}.gn{font-size:22px;fill:#444;letter-spacing:1px}</style>
<line class="gl" x1="236" y1="90" x2="764" y2="90"/>
<line class="gl" x1="236" y1="90" x2="328" y2="610"/>
<line class="gl" x1="236" y1="90" x2="417" y2="586"/>
<path class="ga" d="M 280 90 A 44 44 0 1 0 244 133"/>
<path class="ga" d="M 247 153 A 64 64 0 0 0 258 150"/>
<path class="ga" d="M 265 169 A 84 84 0 0 0 320 90"/>
<line class="gx" x1="255" y1="160" x2="233" y2="178"/>
<text x="175" y="39" text-anchor="middle">x</text>
<text x="208" y="201" text-anchor="middle">10°</text>
<text x="347" y="168" text-anchor="middle">70°</text>
<text class="gn" x="500" y="685" text-anchor="middle">NOT TO SCALE</text>
</svg>