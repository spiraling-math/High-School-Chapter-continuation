<path class="ga" d="M 563 349 A 70 70 0 0 1 429 365"/>
<path class="ga" d="M 429 365 A 70 70 0 0 1 430 392"/>
<path class="ga" d="M 430 392 A 70 70 0 0 1 568 375"/>
