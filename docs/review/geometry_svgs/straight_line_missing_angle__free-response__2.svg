<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-label="Diagram: angles adjacent on one side of a straight line, with an unknown angle x.">
<title>Angles on a straight line</title>
<desc>Angles of 55 degrees, 37 degrees, 47 degrees and an unknown angle x are adjacent, in order, along one side of a straight line.</desc>
<style>.gl{stroke:#111;stroke-width:3;fill:none}.ga{stroke:#111;stroke-width:2;fill:none}.gt{stroke:#111;stroke-width:3}.gx{stroke:#111;stroke-width:3}.gv{fill:#111}text{font-family:sans-serif;font-size:30px;fill:#111}.gn{font-size:22px;fill:#444;letter-spacing:1px}</style>
<line class="gl" x1="880" y1="540" x2="120" y2="540"/>
<line class="gl" x1="500" y1="540" x2="718" y2="229"/>
<line class="gl" x1="500" y1="540" x2="487" y2="160"/>
<line class="gl" x1="500" y1="540" x2="213" y2="291"/>
<path class="ga" d="M 544 540 A 44 44 0 0 0 525 504"/>
<path class="ga" d="M 537 488 A 64 64 0 0 0 498 476"/>
<path class="ga" d="M 497 456 A 84 84 0 0 0 437 485"/>
<path class="ga" d="M 422 472 A 104 104 0 0 0 396 540"/>
<text x="566" y="506" text-anchor="middle">55°</text>
<text x="527" y="450" text-anchor="middle">37°</text>
<text x="452" y="437" text-anchor="middle">47°</text>
<text x="375" y="492" text-anchor="middle">x</text>
<text class="gn" x="500" y="685" text-anchor="middle">NOT TO SCALE</text>
</svg>