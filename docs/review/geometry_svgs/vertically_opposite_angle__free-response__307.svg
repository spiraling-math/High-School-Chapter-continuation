<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-label="Diagram: two straight lines crossing at a point, with a given angle and the angle x in the opposite region.">
<title>Two intersecting straight lines</title>
<desc>Two straight lines cross at a point, forming four angles. One angle measures 10 degrees, and the unknown angle x is in the region directly opposite it.</desc>
<style>.gl{stroke:#111;stroke-width:3;fill:none}.ga{stroke:#111;stroke-width:2;fill:none}.gt{stroke:#111;stroke-width:3}.gx{stroke:#555;stroke-width:1.5;stroke-dasharray:5 4;stroke-linecap:round;fill:none}.gv{fill:#111}text{font-family:sans-serif;font-size:30px;fill:#111}.gn{font-size:22px;fill:#444;letter-spacing:1px}</style>
<line class="gl" x1="120" y1="350" x2="880" y2="350"/>
<line class="gl" x1="126" y1="416" x2="874" y2="284"/>
<path class="ga" d="M 562 350 A 62 62 0 0 0 561 339"/>
<line class="gx" x1="594" y1="342" x2="858" y2="318"/>
<line class="gx" x1="406" y1="358" x2="179" y2="378"/>
<text x="899" y="315" text-anchor="middle">10°</text>
<text x="149" y="381" text-anchor="middle">x</text>
<text class="gn" x="500" y="685" text-anchor="middle">NOT TO SCALE</text>
</svg>