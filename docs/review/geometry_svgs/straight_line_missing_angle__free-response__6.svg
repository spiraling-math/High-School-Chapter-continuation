<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-label="Diagram: angles adjacent on one side of a straight line, with an unknown angle x.">
<title>Angles on a straight line</title>
<desc>Angles of 110 degrees, 60 degrees and an unknown angle x are adjacent, in order, along one side of a straight line.</desc>
<style>.gl{stroke:#111;stroke-width:3;fill:none}.ga{stroke:#111;stroke-width:2;fill:none}.gt{stroke:#111;stroke-width:3}.gx{stroke:#111;stroke-width:3}.gv{fill:#111}text{font-family:sans-serif;font-size:30px;fill:#111}.gn{font-size:22px;fill:#444;letter-spacing:1px}</style>
<line class="gl" x1="880" y1="515" x2="120" y2="515"/>
<line class="gl" x1="500" y1="515" x2="874" y2="448"/>
<line class="gl" x1="500" y1="515" x2="310" y2="185"/>
<path class="ga" d="M 544 515 A 44 44 0 0 0 543 507"/>
<path class="ga" d="M 563 504 A 64 64 0 0 0 468 460"/>
<path class="ga" d="M 458 442 A 84 84 0 0 0 416 515"/>
<line class="gx" x1="552" y1="510" x2="564" y2="495"/>
<text x="578" y="480" text-anchor="middle">x</text>
<text x="542" y="424" text-anchor="middle">110°</text>
<text x="396" y="455" text-anchor="middle">60°</text>
<text class="gn" x="500" y="685" text-anchor="middle">NOT TO SCALE</text>
</svg>