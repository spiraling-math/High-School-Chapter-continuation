<line class="gl" x1="120" y1="160" x2="869" y2="292"/>
<path class="ga" d="M 164 160 A 44 44 0 1 0 158 182"/>
<path class="ga" d="M 175 192 A 64 64 0 0 0 180 182"/>
<path class="ga" d="M 199 189 A 84 84 0 0 0 203 175"/>
<path class="ga" d="M 222 178 A 104 104 0 0 0 224 160"/>
<line class="gx" x1="185" y1="190" x2="185" y2="219"/>
<line class="gx" x1="209" y1="184" x2="227" y2="162"/>
