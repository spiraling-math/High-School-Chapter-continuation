<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-label="Diagram: angles meeting consecutively around a point, with an unknown angle x.">
<title>Angles around a point</title>
<desc>Angles of 44 degrees, 23 degrees, 10 degrees and an unknown angle x are arranged consecutively, with no gaps, around a single point.</desc>
<style>.gl{stroke:#111;stroke-width:3;fill:none}.ga{stroke:#111;stroke-width:2;fill:none}.gt{stroke:#111;stroke-width:3}.gx{stroke:#111;stroke-width:3}.gv{fill:#111}text{font-family:sans-serif;font-size:30px;fill:#111}.gn{font-size:22px;fill:#444;letter-spacing:1px}</style>
<line class="gl" x1="290" y1="381" x2="710" y2="381"/>
<line class="gl" x1="290" y1="381" x2="592" y2="90"/>
<line class="gl" x1="290" y1="381" x2="642" y2="610"/>
<line class="gl" x1="290" y1="381" x2="703" y2="454"/>
<path class="ga" d="M 334 381 A 44 44 0 0 0 322 350"/>
<path class="ga" d="M 336 337 A 64 64 0 1 0 344 416"/>
<path class="ga" d="M 360 427 A 84 84 0 0 0 373 396"/>
<path class="ga" d="M 392 399 A 104 104 0 0 0 394 381"/>
<text x="359" y="353" text-anchor="middle">44°</text>
<text x="196" y="389" text-anchor="middle">x</text>
<text x="396" y="424" text-anchor="middle">23°</text>
<text x="423" y="393" text-anchor="middle">10°</text>
<text class="gn" x="500" y="685" text-anchor="middle">NOT TO SCALE</text>
</svg>