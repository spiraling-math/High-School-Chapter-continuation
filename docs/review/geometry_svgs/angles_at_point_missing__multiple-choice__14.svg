<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-label="Diagram: angles meeting consecutively around a point, with an unknown angle x.">
<title>Angles around a point</title>
<desc>Angles of 11 degrees, 10 degrees and an unknown angle x are arranged consecutively, with no gaps, around a single point.</desc>
<style>.gl{stroke:#111;stroke-width:3;fill:none}.ga{stroke:#111;stroke-width:2;fill:none}.gt{stroke:#111;stroke-width:3}.gx{stroke:#111;stroke-width:3}.gv{fill:#111}text{font-family:sans-serif;font-size:30px;fill:#111}.gn{font-size:22px;fill:#444;letter-spacing:1px}</style>
<line class="gl" x1="120" y1="214" x2="880" y2="214"/>
<line class="gl" x1="120" y1="214" x2="830" y2="486"/>
<line class="gl" x1="120" y1="214" x2="869" y2="346"/>
<path class="ga" d="M 164 214 A 44 44 0 1 0 161 230"/>
<path class="ga" d="M 180 237 A 64 64 0 0 0 183 225"/>
<path class="ga" d="M 203 229 A 84 84 0 0 0 204 214"/>
<text x="38" y="198" text-anchor="middle">x</text>
<text x="452" y="309" text-anchor="middle">11°</text>
<text x="480" y="245" text-anchor="middle">10°</text>
<text class="gn" x="500" y="685" text-anchor="middle">NOT TO SCALE</text>
</svg>