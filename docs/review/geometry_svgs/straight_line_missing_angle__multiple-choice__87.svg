<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-label="Diagram: angles adjacent on one side of a straight line, with an unknown angle x.">
<title>Angles on a straight line</title>
<desc>Angles of 15 degrees, 70 degrees and an unknown angle x are adjacent, in order, along one side of a straight line.</desc>
<style>.gl{stroke:#111;stroke-width:3;fill:none}.ga{stroke:#111;stroke-width:2;fill:none}.gt{stroke:#111;stroke-width:3}.gx{stroke:#111;stroke-width:3}.gv{fill:#111}text{font-family:sans-serif;font-size:30px;fill:#111}.gn{font-size:22px;fill:#444;letter-spacing:1px}</style>
<line class="gl" x1="880" y1="529" x2="120" y2="529"/>
<line class="gl" x1="500" y1="529" x2="867" y2="430"/>
<line class="gl" x1="500" y1="529" x2="370" y2="171"/>
<path class="ga" d="M 544 529 A 44 44 0 0 0 542 518"/>
<path class="ga" d="M 562 512 A 64 64 0 0 0 478 469"/>
<path class="ga" d="M 471 450 A 84 84 0 0 0 416 529"/>
<text x="761" y="497" text-anchor="middle">15°</text>
<text x="547" y="441" text-anchor="middle">x</text>
<text x="402" y="460" text-anchor="middle">70°</text>
<text class="gn" x="500" y="685" text-anchor="middle">NOT TO SCALE</text>
</svg>